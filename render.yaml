services:
  - type: web
    name: rave-mom-api
    runtime: ruby
    plan: free
    buildCommand: "bundle install && bundle exec rails db:migrate"
    startCommand: "bundle exec rails server -e production"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "false"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
